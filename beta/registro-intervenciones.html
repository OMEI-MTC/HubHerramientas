<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

<body>
<div class="topbar">
  <div><b id="tb-titulo">Registro del corte · Intervenciones MTC</b><small id="tb-sub">Hub de Herramientas OGAME · módulo beta</small></div>
  <div class="tb-der"><span class="chip-user" id="tb-user" style="display:none"></span>
    <button class="btn-top" id="tb-salir" style="display:none" onclick="salir()">Salir</button>
    <a class="btn-top" href="../index.html">← Hub</a></div>
</div>
<div class="aviso-beta"><b>Módulo en prueba.</b> Funciona en paralelo y no reemplaza todavía al proceso vigente por Excel ni a la base publicada del Hub.</div>
<div class="aviso-demo" id="aviso-demo" style="display:none"></div>
<div class="main" id="app"></div>

<script>
'use strict';
// ── CONFIGURACIÓN ─────────────────────────────────────────────────────────────
// URL de la aplicación web del Apps Script «IntervencionesMTC_backend.gs» (termina en /exec).
// Si se deja vacía, la página funciona en MODO DEMO con datos de ejemplo guardados en el navegador.
const BACKEND_URL = '';
const MODO_DEMO = !BACKEND_URL || new URLSearchParams(location.search).has('demo');

// ── ESTADO ───────────────────────────────────────────────────────────────────
let S = null;                 // datos del servidor (respuesta de «datos»)
let VISTA = { tab: null, unidad: null, filtroEstado: '', busca: '', sel: null, marcados: new Set(), subtab: 'carpeta' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clave = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
const num = v => { if (typeof v === 'number') return v; const t = String(v ?? '').replace(/[S\/\s]/g, '').replace(/,/g, ''); if (t === '' || t === '-') return NaN; const n = Number(t); return isNaN(n) ? NaN : n; };
const fmt = v => { const n = num(v); return isNaN(n) ? '' : n.toLocaleString('es-PE', { maximumFractionDigits: 2 }); };
const fmtMM = v => 'S/ ' + (v / 1e6).toLocaleString('es-PE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' MM';
const partir = v => String(v ?? '').split(/[,;\/\n]+/).map(p => p.trim().replace(/\.0+$/, '')).filter(p => p && !['NO APLICA', 'PENDIENTE'].includes(clave(p)));
const CAMPOS_REP = ['Monto reportado S/', 'Beneficiarios', 'Modalidad de ejecución', 'Fase', 'Financiamiento (SI/NO)', 'Estado situacional'];
const CAMPOS_ID = ['Tipo', 'Nombre de la intervención', 'Área de influencia', 'Tipo de Código', 'Código', 'Tipo de Infraestructura',
  'Tipo de Órgano ejecutor', 'Crédito suplementario', 'Monto del crédito S/', 'Hoja de Ruta', 'Cartera Priorizada', 'Relevancia sectorial', 'Incluida en'];
const CAMBIO_DIRECTO = ['Tipo de Código', 'Código', 'Crédito suplementario', 'Monto del crédito S/'];

// ── API ──────────────────────────────────────────────────────────────────────
async function api(accion, datos = {}) {
  const payload = Object.assign({ accion, token: sessionStorage.getItem('intmtc_token') || '' }, datos);
  let r;
  if (MODO_DEMO) { await new Promise(x => setTimeout(x, 120)); r = window.DEMO.api(payload); }
  else {
    const resp = await fetch(BACKEND_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
    const t = await resp.text();
    try { r = JSON.parse(t); } catch (e) { throw new Error('El servidor no respondió en formato JSON. Revisa la URL del Apps Script.'); }
  }
  if (r && r.sesion === false) { sessionStorage.removeItem('intmtc_token'); toast(r.mensaje, true); verLogin(); throw new Error(r.mensaje); }
  return r;
}
async function conCarga(fn) {
  const c = document.createElement('div'); c.className = 'cargando'; c.textContent = 'Procesando…'; document.body.appendChild(c);
  try { return await fn(); } catch (e) { console.error(e); toast(e.message || String(e), true); } finally { c.remove(); }
}
function toast(msg, error) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (error ? ' e' : ''); t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), error ? 7000 : 3800);
}
async function recargar() {
  const r = await api('datos'); if (!r.ok) throw new Error(r.mensaje);
  S = r;
  S.ult = {}; (S.ultimos || []).forEach(x => { S.ult[x['COD INTERNO']] = x; });
  S.rep = {}; (S.reportes || []).forEach(x => { if (x['COD INTERNO']) S.rep[x['COD INTERNO']] = x; });
  S.porCod = {}; (S.universo || []).forEach(x => { S.porCod[x['COD INTERNO']] = x; });
  render();
}

// ── REGLAS (mismas que el servidor; el servidor vuelve a validar todo) ───────
const tipoDe = t => S.catalogos.tipos[t] || null;
const enModulo = r => { const t = tipoDe(r['Tipo']); return !!(t && t.modulo && r['Vigente'] === 'SI'); };
const enLista = (lista, v) => (S.catalogos.listas[lista] || []).some(x => clave(x) === clave(v));
function erroresIdentidad(d) {
  const e = []; const t = tipoDe(d['Tipo']);
  if (!t) return ['Elige el tipo'];
  if ((d['Nombre de la intervención'] || '').trim().length < 10) e.push('Nombre de la intervención: mínimo 10 caracteres');
  const areas = String(d['Área de influencia'] || '').split(',').map(s => s.trim()).filter(Boolean);
  if (!areas.length) e.push('Área de influencia obligatoria');
  const tc = d['Tipo de Código'];
  if (!tc) e.push('Elige el tipo de código');
  else if (!t.codigos.includes(tc)) e.push('Tipo de Código no corresponde al tipo');
  const cods = partir(d['Código']);
  if (tc === 'CUI') { if (!cods.length) e.push('Ingresa al menos un CUI'); cods.forEach(c => { if (!/^\d{7}$/.test(c)) e.push('CUI no válido (7 dígitos): ' + c); }); }
  if (tc === 'IDEA') { if (!cods.length) e.push('Ingresa el código IDEA'); cods.forEach(c => { if (!/^\d{5,7}$/.test(c)) e.push('Código IDEA no válido: ' + c); }); }
  if (t.datos) {
    if (!enLista('Tipo de Infraestructura', d['Tipo de Infraestructura'])) e.push('Elige el tipo de infraestructura');
    if (!enLista('Tipo de Órgano ejecutor', d['Tipo de Órgano ejecutor'])) e.push('Elige el tipo de órgano ejecutor');
  }
  if (t.datos && !['SI', 'NO'].includes(d['Crédito suplementario'])) e.push('Indica si tiene crédito suplementario');
  if (t.datos && d['Crédito suplementario'] === 'SI' && !(num(d['Monto del crédito S/']) > 0)) e.push('Monto del crédito obligatorio');
  if (!['SI', 'NO'].includes(d['Hoja de Ruta'])) e.push('Indica si forma parte de la Hoja de Ruta');
  if (d['Hoja de Ruta'] === 'SI') {
    if (!['SI', 'NO'].includes(d['Cartera Priorizada'])) e.push('Indica si es Cartera Priorizada');
    if ((d['Relevancia sectorial'] || '').trim().length < 20) e.push('Relevancia sectorial: mínimo 20 caracteres');
  }
  return e;
}
function erroresReporte(r, tipo, tipoCodigo) {
  const e = []; const t = tipoDe(tipo);
  if ((r['Estado situacional'] || '').trim().length < 15) e.push('Estado situacional: mínimo 15 caracteres');
  if (!t || !t.datos) return e;
  const fases = S.catalogos.modalidades[r['Modalidad de ejecución']];
  if (!fases) e.push('Elige la modalidad de ejecución');
  else if (!fases.some(f => f.fase === r['Fase'])) e.push('Elige la fase (de la modalidad ' + r['Modalidad de ejecución'] + ')');
  if (!['SI', 'NO'].includes(r['Financiamiento (SI/NO)'])) e.push('Indica el financiamiento del año');
  const b = num(r['Beneficiarios']); if (isNaN(b) || b < 0) e.push('Beneficiarios: número obligatorio');
  const m = num(r['Monto reportado S/']);
  if (tipoCodigo !== 'CUI' && (isNaN(m) || m < 0)) e.push('Monto obligatorio (sin CUI es el monto oficial)');
  return e;
}
// Avisos de posibles duplicados (no bloquean)
function palabras(s) { return new Set(clave(s).replace(/[^A-Z0-9 ]/g, ' ').split(' ').filter(w => w.length > 3)); }
function similares(nombre, excluir) {
  const a = palabras(nombre); if (a.size < 2) return [];
  return (S.indice || []).filter(i => i[0] !== excluir).map(i => {
    const b = palabras(i[2]); let c = 0; a.forEach(w => { if (b.has(w)) c++; });
    return { cod: i[0], unidad: i[1], nombre: i[2], s: c / Math.max(1, Math.min(a.size, b.size)) };
  }).filter(x => x.s >= 0.6).sort((x, y) => y.s - x.s).slice(0, 3);
}
function cuiEnUso(cuis, excluir) {
  const out = [];
  (S.indice || []).forEach(i => { if (i[0] === excluir || !i[3]) return; partir(i[3]).forEach(c => { if (cuis.includes(c)) out.push(c + ' en ' + i[0]); }); });
  return out;
}
function sugerirCodigo(sigla) {
  const anio = (S.corte ? S.corte['Corte'] : '').slice(-4) || String(new Date().getFullYear());
  const pref = sigla + '-' + anio; let max = 0;
  (S.indice || []).concat((S.universo || []).map(r => [r['COD INTERNO']])).forEach(i => {
    const c = String(i[0]); if (c.indexOf(pref) === 0) { const n = Number(c.slice(pref.length).split('-')[0]); if (!isNaN(n) && n > max) max = n; }
  });
  return pref + String(max + 1).padStart(3, '0');
}

// ── COMPONENTE DE CAMPOS (desplegables encadenados) ──────────────────────────
// Crea un formulario en «cont» a partir de un estado y una función que devuelve el HTML.
// Los botones de opción y las listas vuelven a dibujar el formulario (y aplican las reglas);
// los textos solo actualizan el estado, para no perder el cursor.
function montarForm(cont, estado, dibujar, alCambiar) {
  const pintar = () => { cont.innerHTML = dibujar(estado); };
  cont.onclick = e => {
    const b = e.target.closest('[data-seg]'); if (b && !b.disabled) { const [k, v] = [b.dataset.seg, b.dataset.v]; estado[k] = estado[k] === v && b.dataset.toggle ? '' : v; reglas(estado, k); pintar(); alCambiar && alCambiar(k); return; }
    const q = e.target.closest('[data-quitar]'); if (q) { const k = q.dataset.quitar; const lista = lst(estado[k], k); lista.splice(Number(q.dataset.i), 1); estado[k] = unir(lista, k); pintar(); alCambiar && alCambiar(k); return; }
    const a = e.target.closest('[data-agregar]'); if (a) { agregarChip(cont, estado, a.dataset.agregar); pintar(); alCambiar && alCambiar(a.dataset.agregar); const i = cont.querySelector('[data-chipin="' + a.dataset.agregar + '"]'); i && i.focus(); }
  };

    const el = e.target;
    if (el.dataset.chipsel) { const k = el.dataset.chipsel; if (el.value) { const l = lst(estado[k], k); if (el.value === 'NACIONAL') estado[k] = 'NACIONAL'; else if (!l.includes(el.value)) { estado[k] = unir(l.filter(x => x !== 'NACIONAL').concat(el.value), k); } } pintar(); alCambiar && alCambiar(k); return; }
    if (el.dataset.k && el.tagName === 'SELECT') { estado[el.dataset.k] = el.value; reglas(estado, el.dataset.k); pintar(); alCambiar && alCambiar(el.dataset.k); }
  };
  cont.oninput = e => { const el = e.target; if (el.dataset.k && el.tagName !== 'SELECT') { estado[el.dataset.k] = el.value; alCambiar && alCambiar(el.dataset.k, true); } };
  // Códigos: se registran al pulsar Enter, coma, punto y coma o espacio, o al salir del cuadro (no solo con ＋)
  cont.onkeydown = e => {
    const k = e.target.dataset && e.target.dataset.chipin; if (!k) return;
    if (['Enter', ',', ';', ' '].includes(e.key)) {
      e.preventDefault(); if (!e.target.value.trim()) return;
      agregarChip(cont, estado, k); pintar(); alCambiar && alCambiar(k);
      const i = cont.querySelector('[data-chipin="' + k + '"]'); i && i.focus();
    }

  cont._alSalir = e => {
    const k = e.target.dataset && e.target.dataset.chipin; if (!k || !e.target.value.trim()) return;
    agregarChip(cont, estado, k);
    // Si el clic fue en otro control, no se vuelve a dibujar (para no perder ese clic): la tarjeta se añade aquí mismo
    if (!e.relatedTarget) { pintar(); alCambiar && alCambiar(k); return; }
    const caja = e.target.closest('.chips'); const l = lst(estado[k], k);
    caja.querySelectorAll('.cchip').forEach(c => c.remove());
    e.target.insertAdjacentHTML('beforebegin', l.map((x, i) => tarjeta(k, x, i, false, caja.dataset.tc)).join(''));
  };
  cont.addEventListener('focusout', cont._alSalir);
  pintar();
  return { repintar: pintar, estado };
}
const lst = (v, k) => k === 'Incluida en' ? String(v || '').split(';').map(s => s.trim()).filter(Boolean)
  : k === 'Área de influencia' ? String(v || '').split(',').map(s => s.trim()).filter(Boolean) : partir(v);
const unir = (l, k) => l.join(k === 'Incluida en' ? '; ' : ', ');

  const i = cont.querySelector('[data-chipin="' + k + '"]'); if (!i) return;
  const nuevos = partir(i.value); if (!nuevos.length) return;
  const l = lst(estado[k], k); nuevos.forEach(n => { if (!l.includes(n)) l.push(n); });
  estado[k] = unir(l, k); i.value = '';
}

function reglas(st, k) {
  const t = tipoDe(st['Tipo']);
  if (k === 'Tipo' && t) {
    if (!t.codigos.includes(st['Tipo de Código'])) st['Tipo de Código'] = t.codigos.length === 1 ? t.codigos[0] : '';
    if (!t.datos) ['Tipo de Infraestructura', 'Tipo de Órgano ejecutor', 'Monto reportado S/', 'Beneficiarios', 'Modalidad de ejecución', 'Fase', 'Financiamiento (SI/NO)', 'Código', 'Crédito suplementario', 'Monto del crédito S/'].forEach(x => { st[x] = ''; });
  }
  if (k === 'Tipo de Código' && !['CUI', 'IDEA'].includes(st['Tipo de Código'])) st['Código'] = '';
  if (k === 'Modalidad de ejecución') { const f = S.catalogos.modalidades[st['Modalidad de ejecución']] || []; if (!f.some(x => x.fase === st['Fase'])) st['Fase'] = ''; }
  if (k === 'Crédito suplementario' && st['Crédito suplementario'] !== 'SI') st['Monto del crédito S/'] = '';
  if (k === 'Hoja de Ruta' && st['Hoja de Ruta'] !== 'SI') { st['Cartera Priorizada'] = ''; st['Relevancia sectorial'] = ''; st['Incluida en'] = ''; }
}

const attrMin = (k, dis) => MINIMOS[k] && !dis ? `data-min="${MINIMOS[k]}"` : '';

const fTxt = (k, v, ph, dis) => `<textarea class="inp" data-k="${esc(k)}" placeholder="${esc(ph || (MINIMOS[k] ? 'Mínimo ' + MINIMOS[k] + ' caracteres' : ''))}" ${dis ? 'disabled' : ''} ${attrMin(k, dis)}>${esc(v || '')}</textarea>` + (MINIMOS[k] && !dis ? contador(v, MINIMOS[k]) : '');
// Campos sueltos (fuera de un formulario) con mínimo de caracteres

  const pct = filas.length ? Math.round(listos / filas.length * 100) : 0;

function cargarMatriz() {
  if (!requiereXLSX()) return;
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets['Matriz'] || wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
    const items = [], errores = [], sinCambio = [];
    filas.forEach((x, i) => {
      const cod = String(x['COD INTERNO'] || '').trim(); if (!cod) return;
      const r = S.porCod[cod];
      if (!r || !enModulo(r)) { errores.push('Fila ' + (i + 2) + ': ' + cod + ' no es de tu unidad'); return; }
      if (estadoDe(cod) === 'Validado') return;
      const campos = {}; CAMPOS_REP.forEach(k => { campos[k] = String(x[k] ?? '').trim(); });
      campos['Financiamiento (SI/NO)'] = clave(campos['Financiamiento (SI/NO)']);
      const cambios = {}; const tc = String(x['Tipo de Código'] || '').trim(); const cd = partir(x['Código']).join(', ');
      if (tc && tc !== r['Tipo de Código']) cambios['Tipo de Código'] = tc;
      if (cd !== partir(r['Código']).join(', ')) { cambios['Código'] = cd; if (!cambios['Tipo de Código']) cambios['Tipo de Código'] = r['Tipo de Código']; }
      const errs = erroresReporte(campos, r['Tipo'], cambios['Tipo de Código'] || r['Tipo de Código']);
      if (Object.keys(cambios).length && String(x['Motivo del cambio de código'] || '').trim().length < 5) errs.push('falta el motivo del cambio de código');
      if (errs.length) errores.push(cod + ': ' + errs.join('; '));
      const base = S.rep[cod] || S.ult[cod] || {};
      const igual = CAMPOS_REP.every(k => String(base[k] || '') === String(campos[k] || '')) && !Object.keys(cambios).length && S.rep[cod];
      if (igual) sinCambio.push(cod);
      items.push({ cod, campos, cambios, motivo: x['Motivo del cambio de código'] || '', completo: !errs.length });
    });
    const completos = items.filter(i => i.completo);
    modal('Cargar matriz · vista previa', `<div class="kpis"><div class="kpi"><div class="v">${items.length}</div><div class="l">Filas leídas de tu unidad</div></div>
      <div class="kpi"><div class="v" style="color:var(--green-dk)">${completos.length}</div><div class="l">Completas (se pueden enviar)</div></div>
      <div class="kpi"><div class="v" style="color:var(--red)">${errores.length}</div><div class="l">Con observaciones</div></div></div>
      ${errores.length ? '<div class="errores" style="max-height:220px;overflow:auto"><ul>' + errores.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul></div>' : ''}
      <p class="sub" style="margin-top:10px">«Guardar como borrador» guarda todas las filas (también las incompletas) para que las termines en el Hub. «Guardar y enviar» envía a OMEI solo las completas.</p>`,
      `<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn" id="mx-b">Guardar como borrador (${items.length})</button><button class="btn g" id="mx-e" ${completos.length ? '' : 'disabled'}>Guardar y enviar (${completos.length})</button>`);
    const ir = enviar => conCarga(async () => {
      const lote = (enviar ? completos : items).map(i => ({ cod: i.cod, campos: i.campos, cambios: i.cambios, motivo: i.motivo, enviar }));
      const r = await api('guardarReportes', { items: lote }); cerrarModal(); toast(r.mensaje, !r.ok); await recargar();
    });
    $('#mx-b').onclick = () => ir(false); $('#mx-e').onclick = () => ir(true);
  };
  inp.click();
}

function resumenUnidades() {
  const out = {};
  Object.keys(S.catalogos.unidades).forEach(s => { out[s] = { n: 0, Pendiente: 0, Borrador: 0, Enviado: 0, Devuelto: 0, Validado: 0, sol: 0 }; });
  S.universo.filter(enModulo).forEach(r => { const o = out[r['Unidad reportante']]; if (!o) return; o.n++; o[estadoDe(r['COD INTERNO'])]++; });
  (S.solicitudes || []).filter(s => s['Estado'] === 'Pendiente').forEach(s => { if (out[s['Unidad reportante']]) out[s['Unidad reportante']].sol++; });
  const asign = {}; (S.asignaciones || []).filter(a => a['Ámbito'] === 'Carpeta Departamental').forEach(a => { asign[a['Clave']] = a['Especialista']; });
  return Object.entries(out).filter(([s, o]) => o.n || o.sol).map(([s, o]) => Object.assign(o, { s, esp: asign[s] || '' }));
}
// Tabla resumen por unidad: cada número abre la lista de esa unidad con ese filtro

        <td style="white-space:nowrap"><span class="mini"><i style="width:${pct}%"></i></span>${pct} %</td><td>${n(o.Pendiente + o.Borrador, o.s, 'Sin registrar')}</td>
        <td>${o.sol ? `<a class="num" onclick="event.stopPropagation();VISTA.tab='solicitudes';VISTA.solUnidad='${esc(o.s)}';render()">${o.sol}</a>` : '<span class="muted">0</span>'}</td>
        <td>${n(o.Enviado, o.s, 'Enviado')}</td><td>${n(o.Devuelto, o.s, 'Devuelto')}</td><td>${n(o.Validado, o.s, 'Validado')}</td>

  };

}
// Panel de revisión de un reporte: ver cambios, editar (corregir) y validar o devolver

  encabezado(ws, j => j === 1 ? '1D7A55' : '0055A5');
  for (let r = 2; r <= cuis.length + 1; r++) {
    ws.getCell('A' + r).numFmt = '@'; ws.getCell('A' + r).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF3F8F5' } };
    ['B', 'C', 'D', 'E'].forEach(c => { ws.getCell(c + r).numFmt = '#,##0.00'; ws.getCell(c + r).dataValidation = { type: 'decimal', operator: 'greaterThanOrEqual', allowBlank: true, formulae: [0], showErrorMessage: true, error: 'Ingresa un monto en soles (número mayor o igual a 0)' }; });
    ws.getCell('F' + r).dataValidation = { type: 'list', allowBlank: true, formulae: ['"SEGUIMIENTO,BANCO_INVERSIONES,SIN_DATO"'], showErrorMessage: true, error: 'Elige una fuente de la lista' };
  }
  await bajarLibro(wb, 'CUIs_Carpeta_Departamental_inversiones_plantilla_corte_' + S.corte['Corte'].replace(/\//g, '-') + '.xlsx');
}
function cargarFinanciera() {
  if (!requiereXLSX()) return;
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets['base'] || wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, { defval: '' });
    if (!filas.length) return toast('El archivo no tiene filas', true);
    const k = Object.keys(filas[0]); const col = re => k.find(x => re.test(String(x).trim()));
    const cCui = col(/^cui$/i), cCosto = col(/^costo_inversion$|^costo de inversi/i), cPia = col(/^pia(_\d{4})?$/i), cPim = col(/^pim(_\d{4})?$/i), cDev = col(/^dev(_\d{4})?$|^devengado/i), cFue = col(/fuente_costo|fuente del costo/i);
    if (!cCui || !cCosto) return toast('No se encontraron las columnas CUI y costo_inversion en la pestaña base', true);
    const datos = filas.map(x => ({ CUI: String(x[cCui]).replace(/\.0+$/, '').trim(), costo: x[cCosto], pia: cPia ? x[cPia] : 0, pim: cPim ? x[cPim] : 0, dev: cDev ? x[cDev] : 0, fuente: cFue ? x[cFue] : '' })).filter(x => x.CUI);
    const enArch = new Set(datos.map(x => x.CUI));
    const vig = new Set(); S.universo.filter(enModulo).forEach(r => { if (r['Tipo de Código'] === 'CUI') partir(r['Código']).forEach(c => vig.add(c)); });
    const faltan = [...vig].filter(c => !enArch.has(c));
    const porFuente = {}; datos.forEach(x => { const k2 = String(x.fuente || 'sin fuente'); porFuente[k2] = (porFuente[k2] || 0) + 1; });
    const sinCompletar = datos.filter(x => String(x.costo ?? '').trim() === '').map(x => x.CUI);
    const m = (f.name.match(/(\d{8})_(\d{4})/) || []); const fecha = m[1] ? m[1].slice(6, 8) + '/' + m[1].slice(4, 6) + '/' + m[1].slice(0, 4) : '';
    modal('Cargar financiera · vista previa', `<p class="sub" style="margin:8px 0">${esc(f.name)} · pestaña «${esc(wb.Sheets['base'] ? 'base' : wb.SheetNames[0])}» · columnas: ${esc([cCui, cCosto, cPia, cPim, cDev, cFue].filter(Boolean).join(', '))}</p>
      <table><tr><td>CUI en el archivo / vigentes del corte</td><td class="${faltan.length ? 'warn' : 'ok'}">${enArch.size} / ${vig.size}</td></tr>
      <tr><td>Por fuente del costo</td><td>${Object.entries(porFuente).map(([a, b]) => esc(a) + ': ' + b).join(' · ')}</td></tr>
      <tr><td>CUI sin costo completado</td><td>${sinCompletar.length ? '<span class="warn">' + sinCompletar.length + ' (se cargarán con 0): ' + esc(sinCompletar.slice(0, 12).join(', ')) + (sinCompletar.length > 12 ? '…' : '') + '</span>' : '<span class="ok">ninguno</span>'}</td></tr>
      <tr><td>CUI vigentes que no están en el archivo</td><td>${faltan.length ? '<span class="warn">' + esc(faltan.join(', ')) + '</span> (tomarán costo 0)' : '<span class="ok">ninguno</span>'}</td></tr></table>
      <div class="f" style="margin-top:10px"><label>Fecha de la consulta</label><input class="inp" id="fin-f" value="${esc(fecha)}" placeholder="dd/mm/aaaa"></div>`,
      `<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn g" id="fin-ok">Confirmar financiera (${datos.length} CUI)</button>`);
    $('#fin-ok').onclick = () => conCarga(async () => { const r = await api('cargarFinanciera', { filas: datos, fechaConsulta: $('#fin-f').value }); if (!r.ok) return mostrarErrores('#modal-err', [r.mensaje]); cerrarModal(); toast(r.mensaje); await recargar(); });
  };
  inp.click();
}

// ── ASIGNACIONES ─────────────────────────────────────────────────────────────
function vistaAsignaciones() {
  const v = $('#vista'); const esp = S.especialistas || [];
  const asig = {}; (S.asignaciones || []).forEach(a => { asig[a['Ámbito'] + '|' + a['Clave']] = a; });
  const res = resumenUnidades();
  const carga = {}; esp.forEach(e => { carga[e.usuario] = { c: 0, h: 0 }; }); let sinC = 0, sinH = 0;
  res.forEach(o => { const a = asig['Carpeta Departamental|' + o.s]; if (a && carga[a['Especialista']]) carga[a['Especialista']].c += o.n; else sinC += o.n; });
  (S.hojaDeRuta || []).forEach(x => { const a = asig['Hoja de Ruta|' + x.cod]; if (a && carga[a['Especialista']]) carga[a['Especialista']].h++; else sinH++; });
  const opts = (sel) => '<option value="">Sin asignar</option>' + esp.map(e => `<option value="${esc(e.usuario)}" ${sel === e.usuario ? 'selected' : ''}>${esc(e.nombre)} (${esc(e.usuario)})</option>`).join('');
  let h = `<div class="dos" style="grid-template-columns:1.6fr 1fr"><div><div class="tabs"><button class="${VISTA.subtab === 'carpeta' ? 'on' : ''}" onclick="VISTA.subtab='carpeta';vistaAsignaciones()">Carpeta Departamental · por unidad reportante</button><button class="${VISTA.subtab === 'hr' ? 'on' : ''}" onclick="VISTA.subtab='hr';vistaAsignaciones()">Hoja de Ruta y Cartera Priorizada · por intervención</button></div>`;
  if (VISTA.subtab === 'carpeta') {
    h += '<div class="tbl"><table><thead><tr><th>Unidad reportante</th><th>Intervenciones vigentes</th><th>Especialista responsable</th><th>Desde</th></tr></thead><tbody>' +
      res.map(o => { const a = asig['Carpeta Departamental|' + o.s]; return `<tr><td><b>${esc(o.s)}</b></td><td>${o.n}</td><td><select class="inp" data-asig="Carpeta Departamental|${esc(o.s)}">${opts(a ? a['Especialista'] : '')}</select></td><td class="muted">${esc(a ? a['Desde'] : '—')}</td></tr>`; }).join('') + '</tbody></table></div>';
  } else {
    const q = clave(VISTA.busca); const fc = VISTA.filtroCartera || ''; const fr = VISTA.filtroResp || '';
    const lista = (S.hojaDeRuta || []).filter(x => (!q || clave(x.cod + ' ' + x.nombre).includes(q)) && (!fc || x.cartera === fc) && (!fr || (fr === '_sin' ? !asig['Hoja de Ruta|' + x.cod] : (asig['Hoja de Ruta|' + x.cod] || {})['Especialista'] === fr)));
    h += `<div class="toolbar"><input class="inp filtro" id="as-q" placeholder="🔍 Buscar" value="${esc(VISTA.busca)}"><select class="inp filtro" id="as-c"><option value="">Cartera: todas</option><option ${fc === 'SI' ? 'selected' : ''} value="SI">Cartera Priorizada: SI</option><option ${fc === 'NO' ? 'selected' : ''} value="NO">Cartera Priorizada: NO</option></select>
      <select class="inp filtro" id="as-r"><option value="">Responsable: todos</option><option value="_sin" ${fr === '_sin' ? 'selected' : ''}>Sin asignar</option>${esp.map(e => `<option ${fr === e.usuario ? 'selected' : ''} value="${esc(e.usuario)}">${esc(e.usuario)}</option>`).join('')}</select><span class="sp"></span>
      <select class="inp filtro" id="as-dest">${opts('')}</select><button class="btn p" id="as-lote">Reasignar seleccionadas (<span id="as-n">0</span>)</button></div>
      <div class="tbl" style="max-height:62vh"><table><thead><tr><th><input type="checkbox" class="chk" id="as-todos"></th><th>COD INTERNO</th><th>Intervención</th><th>Unidad</th><th>Cartera</th><th>Responsable OGAME</th><th>Desde</th></tr></thead><tbody>` +
      (lista.map(x => { const a = asig['Hoja de Ruta|' + x.cod]; return `<tr><td><input type="checkbox" class="chk" data-hr="${esc(x.cod)}"></td><td>${esc(x.cod)}</td><td>${esc(x.nombre)}</td><td>${esc(x.unidad)}</td><td>${esc(x.cartera || 'NO')}</td><td><select class="inp" data-asig="Hoja de Ruta|${esc(x.cod)}">${opts(a ? a['Especialista'] : '')}</select></td><td class="muted">${esc(a ? a['Desde'] : '—')}</td></tr>`; }).join('') || '<tr><td colspan="7" class="vacio">Sin intervenciones</td></tr>') + '</tbody></table></div>';
  }
  h += `</div><div><div class="panel" style="position:static"><div class="tit">Carga de trabajo</div><table style="margin-top:8px"><thead><tr><th>Especialista</th><th>Carpeta (interv.)</th><th>HR / Cartera (interv.)</th></tr></thead><tbody>` +
    esp.map(e => `<tr><td>${esc(e.nombre)}<div class="meta">${esc(e.usuario)}</div></td><td><span class="wl" style="width:${Math.min(110, carga[e.usuario].c / 3)}px"></span>${carga[e.usuario].c}</td><td><span class="wl" style="width:${Math.min(110, carga[e.usuario].h * 2)}px"></span>${carga[e.usuario].h}</td></tr>`).join('') +
    `<tr><td class="warn">Sin asignar</td><td>${sinC}</td><td class="warn">${sinH}</td></tr></tbody></table></div>
    <div class="nota" style="margin-top:12px">Lo que no tiene especialista aparece en la bandeja de <b>todos</b> los especialistas hasta que se asigne. Cada cambio cierra la asignación anterior y abre una nueva, así queda el historial.</div></div></div>`;
  v.innerHTML = h;
  v.querySelectorAll('[data-asig]').forEach(s => s.onchange = () => { const [ambito, cl] = s.dataset.asig.split('|'); conCarga(async () => { const r = await api('guardarAsignaciones', { cambios: [{ ambito, clave: cl, especialista: s.value }] }); toast(r.mensaje, !r.ok); await recargar(); }); });
  if (VISTA.subtab === 'hr') {
    $('#as-q').oninput = e => { VISTA.busca = e.target.value; clearTimeout(window._asq); window._asq = setTimeout(() => { vistaAsignaciones(); const i = $('#as-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 350); };
    $('#as-c').onchange = e => { VISTA.filtroCartera = e.target.value; vistaAsignaciones(); };
    $('#as-r').onchange = e => { VISTA.filtroResp = e.target.value; vistaAsignaciones(); };
    const cuenta = () => { $('#as-n').textContent = v.querySelectorAll('[data-hr]:checked').length; };
    v.querySelectorAll('[data-hr]').forEach(c => c.onchange = cuenta);
    $('#as-todos').onchange = e => { v.querySelectorAll('[data-hr]').forEach(c => { c.checked = e.target.checked; }); cuenta(); };
    $('#as-lote').onclick = () => { const sel = [...v.querySelectorAll('[data-hr]:checked')].map(c => c.dataset.hr); if (!sel.length) return toast('Marca las intervenciones', true);
      conCarga(async () => { const r = await api('guardarAsignaciones', { cambios: sel.map(cl => ({ ambito: 'Hoja de Ruta', clave: cl, especialista: $('#as-dest').value })) }); toast(r.mensaje, !r.ok); await recargar(); }); };
  }
}

// ── UNIVERSO (administrador: consulta y edición con sustento) ────────────────
function vistaUniverso() {
  const v = $('#vista'); const q = clave(VISTA.busca);
  const lista = S.universo.filter(r => !q || clave(r['COD INTERNO'] + ' ' + r['Nombre de la intervención'] + ' ' + r['Código'] + ' ' + r['Unidad reportante']).includes(q));
  const porTipo = {}; S.universo.filter(r => r['Vigente'] === 'SI').forEach(r => { porTipo[r['Tipo']] = (porTipo[r['Tipo']] || 0) + 1; });
  v.innerHTML = `<div class="kpis">${Object.entries(porTipo).map(([t, n]) => `<div class="kpi"><div class="v">${n}</div><div class="l">${esc(t)} vigentes</div></div>`).join('')}<div class="kpi"><div class="v">${S.universo.filter(r => r['Vigente'] !== 'SI').length}</div><div class="l">No vigentes</div></div></div>
    <div class="toolbar"><input class="inp filtro" style="min-width:320px" id="un-q" placeholder="🔍 Buscar por código, nombre, CUI o unidad" value="${esc(VISTA.busca)}"><span class="muted">${lista.length} resultados</span></div>
    <div class="tbl" style="max-height:66vh"><table><thead><tr><th>COD INTERNO</th><th>Tipo</th><th>Unidad</th><th>Intervención</th><th>Código</th><th>Vigente</th><th>Hoja de Ruta</th><th>Cartera</th><th>Crédito</th></tr></thead><tbody>` +
    lista.slice(0, 400).map(r => `<tr class="click" onclick="editarUniverso('${esc(r['COD INTERNO'])}')"><td>${esc(r['COD INTERNO'])}</td><td>${esc(r['Tipo'])}</td><td>${esc(r['Unidad reportante'])}</td><td>${esc(r['Nombre de la intervención'])}</td><td>${esc(textoCodigo(r))}</td><td>${r['Vigente'] === 'SI' ? 'SI' : '<span class="err">NO</span>'}</td><td>${esc(r['Hoja de Ruta'])}</td><td>${esc(r['Cartera Priorizada'])}</td><td>${esc(r['Crédito suplementario'])}</td></tr>`).join('') + '</tbody></table></div>';
  $('#un-q').oninput = e => { VISTA.busca = e.target.value; clearTimeout(window._unq); window._unq = setTimeout(() => { vistaUniverso(); const i = $('#un-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 350); };
}
function editarUniverso(cod) {
  const r = S.porCod[cod]; const st = Object.assign({}, r); const admin = S.usuario.rol === 'Administrador';
  modal('Universo · ' + esc(cod), '', admin ? `<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn p" id="un-ok">Guardar cambios</button>` : '<button class="btn" onclick="cerrarModal()">Cerrar</button>');
  $('#modal-cuerpo').insertAdjacentHTML('beforebegin', `<div class="meta" style="margin:8px 0">Alta: ${esc(r['Fecha de alta'])} · ${esc(r['Registrado por'])}${r['Última modificación'] ? ' · Última modificación: ' + esc(r['Última modificación']) + ' por ' + esc(r['Modificado por']) : ''}</div>` +
    (admin ? `<div class="fg"><div class="f"><label>Vigente</label><select class="inp" id="un-vig"><option ${r['Vigente'] === 'SI' ? 'selected' : ''}>SI</option><option ${r['Vigente'] !== 'SI' ? 'selected' : ''}>NO</option></select></div><div class="f"><label>Sustento del cambio *</label>${inpMin('un-sus', 5)}</div></div>` : ''));
  montarForm($('#modal-cuerpo'), st, x => dibujarIntervencion(x, { rep: false, avisos: false, ro: admin ? new Set() : new Set(CAMPOS_ID) }));
  if (admin) $('#un-ok').onclick = () => conCarga(async () => {
    const cambios = {}; CAMPOS_ID.forEach(k => { if (String(st[k] || '') !== String(r[k] || '')) cambios[k] = st[k]; });
    if ($('#un-vig').value !== r['Vigente']) cambios['Vigente'] = $('#un-vig').value;
    const errs = erroresIdentidad(st); if (errs.length) return mostrarErrores('#modal-err', errs);
    const x = await api('editarUniverso', { cod, cambios, sustento: $('#un-sus').value });
    if (!x.ok) return mostrarErrores('#modal-err', [x.mensaje]); cerrarModal(); toast(x.mensaje); await recargar();
  });
}

async function cargarScript(src) { return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); }); }

    window.cargarBackendDemo(src);
    window.DEMO.asegurar();
    const ad = $('#aviso-demo'); ad.style.display = 'flex';
