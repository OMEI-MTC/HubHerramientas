<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red:    #C8102E;
    --blue:   #0055A5;
    --blue-dk:#003F7D;
    --white:  #ffffff;
    --bg:     #F2F2F2;
    --card:   #ffffff;
    --border: rgba(0,0,0,0.09);
    --text:   #1a1a1a;
    --text-2: #4a5568;
    --sans: 'DM Sans', system-ui, sans-serif;
    --serif: 'DM Serif Display', serif;
    --r: 12px;
  }
  html, body { height: 100%; }
  body { font-family:var(--sans); background:var(--bg); color:var(--text); font-size:14px; line-height:1.5; }
  .layout { height:100vh; display:flex; flex-direction:column; }

  /* ── Topbar (idéntico al Hub) ── */
  .topbar {
    background: var(--red);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; min-height: 100px; flex-shrink: 0;
  }
  .topbar-brand { display:flex; align-items:center; gap:14px; }
  .topbar-logo { width:52px; height:52px; border-radius:8px; overflow:hidden; flex-shrink:0; box-shadow:0 1px 6px rgba(0,0,0,0.25); }
  .topbar-logo img { width:100%; height:100%; object-fit:cover; display:block; }
  .topbar-name { font-size:28px; font-weight:700; color:var(--white); line-height:1.2; letter-spacing:-0.01em; }
  .topbar-sub  { font-size:14px; color:rgba(255,255,255,0.85); margin-top:3px; font-weight:400; }
  .btn-back {
    display:flex; align-items:center; gap:7px;
    background:#003F7D; color:#fff; border:2px solid #003F7D;
    border-radius:24px; padding:8px 18px;
    font-family:var(--sans); font-size:15px; font-weight:700;
    cursor:pointer; white-space:nowrap; transition:background .12s; text-decoration:none;
  }
  .btn-back:hover { background:#002D5C; border-color:#002D5C; }

  /* ── Contenido ── */
  .main { flex:1; display:flex; flex-direction:column; padding:20px 28px 24px; min-height:0; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .panel-title { font-family:var(--serif); font-size:30px; color:var(--blue); line-height:1.1; }
  .panel-sub { font-size:15px; color:var(--text-2); margin-top:4px; }
  .btn-open {
    font-size:13px; font-weight:600; color:var(--blue); text-decoration:none;
    border:1px solid #8FAADC; border-radius:20px; padding:6px 14px; background:#fff; white-space:nowrap;
  }
  .btn-open:hover { background:#EEF4FF; }


  /* ── Ayuda Memoria ── */
  .acciones { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .am-box { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid #8FAADC; border-radius:24px; padding:4px 4px 4px 14px; }
  .am-box label { font-size:13px; font-weight:600; color:var(--blue-dk); white-space:nowrap; }
  .am-box select { font-family:var(--sans); font-size:13px; border:none; background:transparent; color:var(--text); padding:4px 2px; min-width:150px; cursor:pointer; outline:none; }
  .btn-am { font-family:var(--sans); font-size:13px; font-weight:700; color:#fff; background:var(--red); border:none; border-radius:20px; padding:7px 16px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; }
  .btn-am:hover { background:#A50D26; }
  .btn-am:disabled { background:#C9CFD8; cursor:not-allowed; }
  .am-estado { font-size:12px; color:var(--text-2); width:100%; min-height:16px; padding-left:14px; }
  .am-estado.error { color:var(--red); }

  /* Contenedor del visor: ocupa todo el alto disponible */
  /* El visor toma la proporción del reporte (16:9) + la barra inferior de Power BI (~56px),
     con el mayor tamaño posible que quepa completo en la pantalla */
  .visor {
    --barra-pbi: 56px;
    --ancho: min(100vw - 56px, (100vh - 230px - var(--barra-pbi)) * 16 / 9);
    width: var(--ancho);
    height: calc(var(--ancho) * 9 / 16 + var(--barra-pbi));
    margin: 0 auto; flex: none;
    background:var(--card); border:1px solid var(--border); border-radius:var(--r);
    overflow:hidden;
  }
  .visor iframe { width:100%; height:100%; border:0; display:block; }

  @media (max-width: 720px) {
    .topbar { flex-wrap:wrap; gap:12px; padding:14px 18px; }
    .topbar-name { font-size:20px; }
    .main { padding:16px; }
    .visor { --ancho: calc(100vw - 32px); }
  }
</style>

<script>
// ====== CONFIGURACIÓN ======
// Para cambiar de tablero, solo reemplaza este enlace.
const VISOR_URL = 'https://app.powerbi.com/view?r=eyJrIjoiNWIxMTVkYWUtMDMwMi00YWRmLTg5MzEtMzY1ZDVmYzVjMjFmIiwidCI6IjUzYWNiMjY1LTkxMjgtNDQ2ZC1hNWJlLWI4Mzg2MDBhYTY1NyJ9&language=en-US';

document.getElementById('visor').src = VISOR_URL;
document.getElementById('btnOpen').href = VISOR_URL;

// ====== Tamaño del visor: el reporte (16:9) lo más grande posible, sin superar el alto de la ventana ======
const PBI_PROPORCION = 16 / 9;   // proporción de las páginas del reporte
const PBI_BARRA = 56;            // barra inferior de Power BI (páginas, zoom)
function ajustarVisor() {
  const visor = document.querySelector('.visor');
  const main = document.querySelector('.main');
  const est = getComputedStyle(main);
  const anchoMax = main.clientWidth - parseFloat(est.paddingLeft) - parseFloat(est.paddingRight);
  // El visor puede ocupar toda la altura de la ventana: al bajar, el encabezado se desplaza y el reporte queda completo
  const altoDisp = window.innerHeight - 2 * parseFloat(est.paddingBottom);
  let ancho = Math.min(anchoMax, (altoDisp - PBI_BARRA) * PBI_PROPORCION);
  if (ancho < 360) ancho = anchoMax;   // pantallas muy bajas: usar todo el ancho
  visor.style.width = ancho + 'px';
  visor.style.height = (ancho / PBI_PROPORCION + PBI_BARRA) + 'px';
}
window.addEventListener('resize', ajustarVisor);
ajustarVisor();
</script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.6.1/dist/index.iife.js"></script>
<script>
/* =====================================================================
   GENERADOR DE AYUDA MEMORIA DEPARTAMENTAL (Word)
   Requiere la librería docx cargada antes (variable global "docx").
   ===================================================================== */

// ====== CONFIGURACIÓN: periodos, cortes y fuentes (editar aquí) ======
const AM_CONFIG = {
  periodoActividad: 'II trimestre de 2026',
  periodoActividadCorto: 'II Trim. 2026',
  anioAnteriorActividad: '2025',
  anioSocial: '2025',
  corteVial: 'diciembre de 2025',
  anioVialAnterior: '2024',
  corteCobertura: 'Dic. 2025',
  anioTIC: '2025',
  anioPresupuesto: '2026',
  cortePresupuesto: '29 de setiembre de 2026',
  fuentes: {
    actividad: 'INEI – Indicador de la Actividad Productiva Departamental, II trimestre 2026 (año base 2007 = 100).',
    competitividad: 'Instituto Peruano de Economía (IPE) – Índice de Competitividad Regional (INCORE) 2024.',
    social: 'Estimaciones OMEI-OGAME-MTC con base en INEI – Encuesta Nacional de Hogares (ENAHO) 2025.',
    vial: 'MTC – Unidad de Estadística, con información del Sistema Nacional de Carreteras (SINAC), diciembre 2025.',
    cobertura: 'Organismo Supervisor de Inversión Privada en Telecomunicaciones (OSIPTEL) – Centros poblados con cobertura reportados por las empresas operadoras, diciembre 2025.',
    tic: 'Diagnóstico de brechas de infraestructura o de acceso a servicios 2025, elaborado con información de INEI – Encuesta Nacional de Hogares (ENAHO) 2025.',
    presupuesto: 'Ministerio de Economía y Finanzas (MEF) – Consulta Amigable, corte al 29 de setiembre de 2026.'
  }
};

// ====== Lectura de datos ======
function amParseTSV(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '');
  const headers = lines[0].split('\t').map(h => h.trim());
  return lines.slice(1).map(l => {
    const cells = l.split('\t'); const o = {};
    headers.forEach((h, i) => { o[h] = (cells[i] ?? '').trim(); });
    return o;
  });
}
// Convierte "1,884.20", "17.43%", "0,1743", "-15.47" a número. Vacío → null.
function amNum(v) {
  if (v === null || v === undefined) return null;
  let s = String(v).trim().replace(/\s/g, '');
  if (s === '' || s === '-' || /^#/.test(s) || /^n\/?a$/i.test(s)) return null;
  let pct = false;
  if (s.endsWith('%')) { pct = true; s = s.slice(0, -1); }
  const hasDot = s.includes('.'), hasComma = s.includes(',');
  if (hasDot && hasComma) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (hasComma) {
    if (/^-?[1-9]\d{0,2}(,\d{3})+$/.test(s)) s = s.replace(/,/g, '');
    else s = s.replace(',', '.');
  }
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  return pct ? n / 100 : n;
}

// ====== Formato ======
const amFmt = (n, d = 1) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const amPct = f => amFmt(f * 100) + ' %';          // fracción → "17.4 %"
const amR = f => Math.round(f * 1000) / 1000;      // redondeo a 1 decimal en %
const amPP = (a, b) => amFmt(Math.abs(amR(a) - amR(b)) * 100); // diferencia en puntos porcentuales
const AM_NUM_TXT = ['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce'];
const AM_ORD = ['primer','segundo','tercer','cuarto','quinto','sexto','séptimo','octavo','noveno','décimo','undécimo','duodécimo'];
// Personas (dato en miles): 272.0 → "272.0 mil personas"; 1,413.2 → "1.41 millones de personas"
const amPersonas = (miles, sust = 'personas') => miles >= 1000
  ? `${amFmt(miles / 1000, 2)} millones de ${sust}` : `${amFmt(miles)} mil ${sust}`;
const amJoin = arr => arr.length <= 1 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' y ' + arr[arr.length - 1];
// ====== Fechas de corte ======
const AM_MES_N = { ene:1, feb:2, mar:3, abr:4, may:5, jun:6, jul:7, ago:8, set:9, sep:9, oct:10, nov:11, dic:12,
  jan:1, apr:4, aug:8, dec:12 };
const AM_ROM = ['I','II','III','IV'];
// Lee "30/06/2026", "2026-06-30", "29-Sep-26", "Junio 2026", "Jun-26", "jun. 2026", número de serie de Excel → {d, m, y}
function amFecha(txt) {
  const s = String(txt || '').trim(); if (!s) return null;
  const y4 = y => { y = +y; return y < 100 ? 2000 + y : y; };
  let m;
  if (/^\d{5}(\.\d+)?$/.test(s)) { const f = new Date(Math.round((+s - 25569) * 864e5)); return { d: f.getUTCDate(), m: f.getUTCMonth() + 1, y: f.getUTCFullYear() }; }
  if ((m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/))) return { d: +m[3], m: +m[2], y: +m[1] };
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) {
    let a = +m[1], b = +m[2]; if (b > 12 && a <= 12) [a, b] = [b, a];   // formato mes/día
    return { d: a, m: b, y: y4(m[3]) };
  }
  if ((m = s.match(/^(\d{1,2})[\s\-\/.]+(?:de\s+)?([A-Za-zÁÉÍÓÚáéíóú]+)\.?[\s\-\/.]+(?:de\s+|del\s+)?(\d{2,4})$/))) {
    const mm = AM_MES_N[m[2].slice(0, 3).toLowerCase()]; if (mm) return { d: +m[1], m: mm, y: y4(m[3]) };
  }
  if ((m = s.match(/^([A-Za-zÁÉÍÓÚáéíóú]+)\.?[\s\-\/.]+(?:de\s+|del\s+)?(\d{2,4})$/))) {
    const mm = AM_MES_N[m[1].slice(0, 3).toLowerCase()]; if (mm) return { d: null, m: mm, y: y4(m[2]) };
  }
  return null;
}
const amMesLargo = f => AM_MESES[f.m - 1].toLowerCase() + ' de ' + f.y;               // junio de 2026
const amMesCorto = f => AM_MESES[f.m - 1].slice(0, 3) + '. ' + f.y;                   // Jun. 2026
const amDiaLargo = f => (f.d ? f.d + ' de ' : '') + amMesLargo(f);                     // 29 de setiembre de 2026
// Trimestre: acepta una fecha o un texto como "II Trim. 2026"
function amTrimestre(txt) {
  const s = String(txt || '').trim();
  let m = s.match(/\b(IV|III|II|I)\b[^\d]*(\d{4})/i);
  let q, y;
  if (m) { q = AM_ROM.indexOf(m[1].toUpperCase()) + 1; y = +m[2]; }
  else { const f = amFecha(s); if (!f) return null; q = Math.ceil(f.m / 3); y = f.y; }
  return { largo: `${AM_ROM[q - 1]} trimestre de ${y}`, corto: `${AM_ROM[q - 1]} Trim. ${y}`, fuente: `${AM_ROM[q - 1]} trimestre ${y}`, anterior: String(y - 1) };
}

// "Var. Diciembre 2025/ Junio 2026" → { ant: 'diciembre de 2025', act: 'junio de 2026', actCorto: 'Jun. 2026' }
function amCorte(txt) {
  const partes = String(txt || '').replace(/^\s*var\.?\s*/i, '').split('/').map(p => p.trim()).filter(Boolean);
  if (partes.length !== 2) return null;
  const largo = p => { const m = p.match(/^([A-Za-zÁÉÍÓÚáéíóúñÑ]+)\s+(\d{4})$/); return m ? m[1].toLowerCase() + ' de ' + m[2] : p; };
  const corto = p => { const m = p.match(/^([A-Za-zÁÉÍÓÚáéíóúñÑ]+)\s+(\d{4})$/); return m ? m[1].charAt(0).toUpperCase() + m[1].slice(1, 3).toLowerCase() + '. ' + m[2] : p; };
  return { ant: largo(partes[0]), act: largo(partes[1]), actCorto: corto(partes[1]) };
}
const AM_MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Setiembre','Octubre','Noviembre','Diciembre'];

const AM_SECTORES = {
  'AGROPECUARIO': 'agropecuario', 'PESCA': 'pesca', 'MINERÍA E HIDROCARBUROS': 'minería e hidrocarburos',
  'MANUFACTURA': 'manufactura', 'ELECTRICIDAD, GAS Y AGUA': 'electricidad, gas y agua', 'CONSTRUCCIÓN': 'construcción',
  'COMERCIO': 'comercio', 'TRANSPORTE Y ALMACENAMIENTO': 'transporte y almacenamiento', 'TELECOMUNICACIONES': 'telecomunicaciones',
  'ADMINISTRACIÓN PÚBLICA Y DEFENSA': 'administración pública y defensa', 'OTRAS ACTIVIDADES 1/': null, 'OTROS SERVICIOS': null
};

// Nombres de columna de la base (si cambian en el Sheet, cambiar solo aquí)
const C = {
  dep: 'Departamento', macro: 'Macro región',
  act: 'Índice de la Actividad Productiva Departamental', ic: 'Índice de competitividad', icPuesto: 'Puesto IC',
  pobreza: 'Tasa de Pobreza Monetaria', desempleo: 'Tasa de Desempleo',
  rvnExist: 'RVN existente', rvnPav: 'RVN Pavimentada', rvnBueno: 'RVN Pavimentada Buen estado',
  rvnBuenoRep: 'Rep. RVN Pavimentada Buen estado', rvnVar: 'Var RVN buen estado actual', corteVial: 'Corte Red Vial',
  rvdTot: 'RVD Total', rvdPav: 'RVD pavimentada', rvvTot: 'RVV Total', rvvPav: 'RVV pavimentada',
  ferro: 'Ferrocarriles (KM)', puertos: 'Terminales portuarios', aero: 'Aeroportuario',
  ccppTot: 'Total de CP', ccppSinPct: 'CCPP (%) sin cob', ccppCon: 'CCPP con cobertura', ccpp2GPct: 'CCPP con cobertura 2G',
  internet: 'uso de internet', compu: 'uso de compu', celular: 'uso de celular',
  internetPct: 'uso de internet %', compuPct: 'compu %', celularPct: 'Celular %',
  corteAct: 'Corte Ind Act.', corteFin: 'Corte Info Financiera', corteCob: 'Corte cobertura',
  pimT: 'PIM TRANS', devT: 'DevTRANS ult.', avT: 'Avance Fi Anual Trans', gnPctT: '% GN TRANS', devGnT: 'DevTRANS GN ult.',
  grglPctT: '% GR+GL TRANS', devGrglT: 'DevTRANS GR+GL',
  pimC: 'PIMCOM ult', devC: 'DevCOM ult.', avC: 'Avance Fi Anual COM', gnPctC: '% GN COM', devGnC: 'DevCOM GN ult.',
  grglPctC: '% GR+GL COM', devGrglC: 'DevCOM GR+GL',
  secDep: 'Departamento', secAct: 'Actividad', secVar: 'Variación interanual de la Producción Sectorial'
};
// Columnas que son fracciones (0.174 = 17.4 %)
const AM_FRAC = ['internetPct','compuPct','celularPct','pobreza','desempleo','rvnBuenoRep','rvnVar','ccppSinPct','ccpp2GPct','avT','gnPctT','grglPctT','avC','gnPctC','grglPctC'];

function amGetter(row) {
  return key => {
    let v = amNum(row[C[key]]);
    if (v !== null && AM_FRAC.includes(key) && Math.abs(v) > 1.5) v = v / 100;
    return v;
  };
}

// ====== Textos (reglas) ======
function amTextos(depName, rows, secRows) {
  const find = n => rows.find(r => (r[C.dep] || '').trim().toLowerCase() === n.toLowerCase());
  const R = find(depName); if (!R) throw new Error('No se encontró el departamento: ' + depName);
  const N = find('Nacional') || {};
  const g = amGetter(R), n = amGetter(N);
  const dep = R[C.dep].trim();
  const macro = (R[C.macro] || '').trim();
  const pares = macro ? rows.filter(r => (r[C.macro] || '').trim() === macro) : [];
  const out = { dep, macro, key: [], kpis: [], secciones: [], faltantes: [] };
  const falta = (...keys) => keys.filter(k => g(k) === null).forEach(k => out.faltantes.push(C[k]));
  const txt = key => (R[C[key]] || N[C[key]] || '').trim();
  const trim = amTrimestre(txt('corteAct'));
  const P = {
    act: trim ? trim.largo : AM_CONFIG.periodoActividad,
    actCorto: trim ? trim.corto : AM_CONFIG.periodoActividadCorto,
    actAnt: trim ? trim.anterior : AM_CONFIG.anioAnteriorActividad,
    fuenteAct: trim ? `INEI – Indicador de la Actividad Productiva Departamental, ${trim.fuente} (año base 2007 = 100).` : AM_CONFIG.fuentes.actividad
  };
  const ff = amFecha(txt('corteFin'));
  P.fin = ff ? amDiaLargo(ff) : P.fin;
  P.finAnio = ff ? String(ff.y) : P.finAnio;
  P.fuenteFin = ff ? `Ministerio de Economía y Finanzas (MEF) – Consulta Amigable, corte al ${P.fin}.` : AM_CONFIG.fuentes.presupuesto;
  const fc = amFecha(txt('corteCob'));
  P.cob = fc ? amMesLargo(fc) : null;
  P.cobCorto = fc ? amMesCorto(fc) : AM_CONFIG.corteCobertura;
  P.fuenteCob = fc ? `Organismo Supervisor de Inversión Privada en Telecomunicaciones (OSIPTEL) – Centros poblados con cobertura reportados por las empresas operadoras, ${P.cob}.` : AM_CONFIG.fuentes.cobertura;

  // --- 1. Contexto económico
  const s1 = [];
  const act = g('act'), actN = n('act');
  if (act !== null) {
    let t = `En el ${P.act}, la actividad productiva de ${dep} ${act >= 0 ? 'creció' : 'se contrajo'} ${amFmt(Math.abs(act))} % respecto al mismo periodo de ${P.actAnt}`;

// ====== AYUDA MEMORIA: fuentes de datos (Google Sheets publicado como TSV) ======
const AM_URL_DATOS   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSfxbrTt12Dh8n0qYW_-NlX7GYiZFYJkp_h8vzHe8wIjZ8E14MaKNaB_-Kb-cCpL9EqRscpxLCQta_p/pub?gid=1452101256&single=true&output=tsv';
const AM_URL_SECTORES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSfxbrTt12Dh8n0qYW_-NlX7GYiZFYJkp_h8vzHe8wIjZ8E14MaKNaB_-Kb-cCpL9EqRscpxLCQta_p/pub?gid=378268387&single=true&output=tsv';

let AM_FILAS = [], AM_SECT = [];
const amSel = document.getElementById('amDep'), amBtn = document.getElementById('amBtn'), amEst = document.getElementById('amEstado');
const amMsg = (t, err) => { amEst.textContent = t; amEst.className = 'am-estado' + (err ? ' error' : ''); };

async function amCargar() {
  try {
    const [a, b] = await Promise.all([fetch(AM_URL_DATOS), fetch(AM_URL_SECTORES)]);
    if (!a.ok || !b.ok) throw new Error('HTTP ' + a.status + '/' + b.status);
    AM_FILAS = amParseTSV(await a.text());
    AM_SECT = amParseTSV(await b.text());
    const deps = AM_FILAS.map(r => (r[C.dep] || '').trim()).filter(d => d && d.toLowerCase() !== 'nacional')
      .sort((x, y) => x.localeCompare(y, 'es'));
    amSel.innerHTML = '<option value="">Elegir departamento…</option>' + deps.map(d => `<option>${d}</option>`).join('');
    amSel.disabled = false; amMsg('');
  } catch (e) {
    console.error(e);
    amSel.innerHTML = '<option>Sin datos</option>';
    amMsg('No se pudieron cargar los datos de la Ayuda Memoria.', true);
  }
}
amSel.addEventListener('change', () => { amBtn.disabled = !amSel.value; amMsg(''); });
amBtn.addEventListener('click', async () => {
  const dep = amSel.value; if (!dep) return;
  if (typeof docx === 'undefined') { amMsg('La librería de Word aún no carga; intenta en unos segundos.', true); return; }
  amBtn.disabled = true; amMsg('Generando documento…');
  try {
    const am = amTextos(dep, AM_FILAS, AM_SECT);
    const blob = await docx.Packer.toBlob(amDocumento(am));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'AM_' + dep.replace(/\s+/g, '_') + '.docx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    amMsg(am.faltantes.length ? 'Descargado. Datos vacíos en la base: ' + am.faltantes.join(', ') : 'Descargado.', am.faltantes.length > 0);
  } catch (e) {
    console.error(e); amMsg('Error al generar: ' + e.message, true);
  } finally { amBtn.disabled = false; }
});
amCargar();
</script>
